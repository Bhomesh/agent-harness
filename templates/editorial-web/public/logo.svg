<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="swiftBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Dynamic Swift / Shift Icon -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="#1e1b4b" stroke="url(#swiftBrandGrad)" stroke-width="1.8" />
    <!-- Stylized Swift Wing / Lightning Shift Monogram -->
    <path d="M18 42L36 17L29 30L44 26L21 47L26 36L18 42Z" fill="url(#swiftBrandGrad)" />
    <circle cx="39" cy="17" r="2.5" fill="#fbcfe8" />
  </g>

  <!-- Wordmark -->
  <text x="86" y="44" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    BUILD<tspan fill="url(#textGrad)">SHIFT</tspan>
  </text>
  <text x="88" y="60" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="3.2">
    TECHNOLOGIES
  </text>
</svg>
